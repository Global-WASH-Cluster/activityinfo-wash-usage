name: Refresh ActivityInfo snapshot

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests==2.32.3 cryptography==43.0.3

      - name: Build snapshot
        env:
          ACTIVITYINFO_TOKEN: ${{ secrets.ACTIVITYINFO_TOKEN }}
          SNAPSHOT_PASSWORD: ${{ secrets.SNAPSHOT_PASSWORD }}
        run: |
          if [ -z "$ACTIVITYINFO_TOKEN" ] || [ -z "$SNAPSHOT_PASSWORD" ]; then
            echo "::error::Repository secrets ACTIVITYINFO_TOKEN and SNAPSHOT_PASSWORD must both be set"; exit 1
          fi
          python pipeline/build_snapshot.py

      - name: Check no secret or plaintext data is published
        env:
          ACTIVITYINFO_TOKEN: ${{ secrets.ACTIVITYINFO_TOKEN }}
          SNAPSHOT_PASSWORD: ${{ secrets.SNAPSHOT_PASSWORD }}
        run: |
          for s in "$ACTIVITYINFO_TOKEN" "$SNAPSHOT_PASSWORD"; do
            if grep -rqF -- "$s" data/ index.html assets/; then
              echo "::error::A secret string was found in published files; aborting"; exit 1
            fi
          done
          plain=$(find data -name '*.json' ! -name '*.enc.json')
          if [ -n "$plain" ]; then
            echo "::error::Unencrypted data files present: $plain"; exit 1
          fi

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change in snapshot"; exit 0
          fi
          git commit -m "data: ActivityInfo snapshot $(date -u +%Y-%m-%d)"
          git push
